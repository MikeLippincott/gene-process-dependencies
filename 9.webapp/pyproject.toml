[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gene-dependency-webapp"
version = "0.1.0"
description = "Interactive Streamlit webapp for exploring gene dependency plots"
requires-python = ">=3.12"
dependencies = [
	"streamlit",
	"plotly",
	"pandas",
	"pyarrow",
	"matplotlib",
	"numpy",
]

[tool.setuptools]
py-modules = ["app", "app_utils"]
